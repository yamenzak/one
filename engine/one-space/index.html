<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>One</title>
    <meta name="description" content="Your workspaces." />

    <!-- ⚠️ EVERY ONE OF THESE IS SERVED BY THE WORKER, NOT SHIPPED IN `dist`,
         and that is what makes one page correct on every door. The icon a
         workspace shows is ITS icon — its colours, or the logo it uploaded — and
         a file baked into the bundle is one picture for every workspace on the
         deployment. `serve.ts` answers all five paths per host.

         ⚠️ AND THEY ARE DECLARED EVEN THOUGH A BROWSER ASKS FOR MOST OF THEM
         ANYWAY. `/favicon.ico` and `/apple-touch-icon.png` are guessed at only
         when nothing is declared, and the guess costs a round trip on every cold
         start; declaring them is also what lets the SVG be preferred where it
         works, which is everywhere except the home screen. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ⚠️ THE THREE QUESTIONS EVERY VISIT STARTS WITH, ASKED BEFORE THE BUNDLE
         HAS ARRIVED. Which door this is, who is here, and what this deployment
         holds are what decide the first screen, and nothing in the page can be
         drawn without them — so asked from the application they were asked AFTER
         several hundred kilobytes of JavaScript had been downloaded, parsed and
         run. Three waits, end to end, for answers that could have been
         travelling the whole time.

         ⚠️ AND THE CENTRE WAS WORSE THAN THAT: IT WAITED FOR AN ANSWER IT DOES
         NOT NEED. The only thing that reads it is not rendered until `me.who`
         has said somebody is here, so the request carrying every manifest in the
         deployment did not leave until a whole round trip had already been
         spent — and the screen behind it then started its own reads. Measured
         live on a phone: 4.1s, then 2.2s, then 2.7s. Three waves, nine seconds,
         over requests that spent nine milliseconds of CPU between them. The
         centre wants nothing from the session and nothing from the door; it is
         authorised by the cookie the browser already has.

         ⚠️ IT IS ASKED ON EVERY DOOR, INCLUDING THE ONES WITH NO CENTRE TO READ.
         Which door this is comes from `/health`, and waiting to find out would
         put back the wave this removes — the browser must never classify its own
         hostname (D17). The signpost and the setup door pay one refused request,
         beside two they were making anyway, and it costs them no wait at all.

         ⚠️ AN INLINE SCRIPT, BECAUSE THAT IS THE ONLY THING THAT RUNS THIS
         EARLY. A module script is deferred by definition; this executes as the
         parser reaches it, which is before the browser has finished fetching
         anything below. `api.ts` picks the answers up when it needs them, so the
         round trip overlaps the download instead of following it.

         ⚠️ AND IT CANNOT BREAK THE PAGE. Every failure resolves to `null` and
         the application asks again for real — a preflight is a head start, never
         a dependency. `same-origin` is what sends the session cookie; without it
         the answer would be "nobody is signed in", confidently, every time. -->
    <script>
      (function () {
        try {
          var ask = function (url) {
            return fetch(url, { credentials: "same-origin" })
              .catch(function () { return null; });
          };
          window.__one = {
            "health": ask("/health"),
            "me.who": ask("/api/me.who"),
            "centre.view": ask("/api/centre.view"),
          };
        } catch (e) {}
      })();
    </script>

    <!-- ⚠️ The ground is painted before a single component mounts. Without it a
         cold start on a dark device is a white flash, which reads as a fault. -->
    <meta name="color-scheme" content="light dark" />
    <!-- ⚠️ BEFORE THE STYLESHEET, AND BEFORE THE BUNDLE. HeroUI has no
         `prefers-color-scheme` rule at all — dark is `[data-theme="dark"]` on the
         document — so this is what selects it, and doing it from the bundle
         instead means the browser has already painted the light theme by the
         time React mounts. `APPEARANCE_SCRIPT` in @engine/web is this string. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem("one:appearance");
          if (c !== "light" && c !== "dark") {
            c = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = c;
          document.documentElement.style.colorScheme = c;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
