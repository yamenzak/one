packages:
  # OneEngine — the framework, and One, the deployment built on it. Inert by
  # construction: nothing here is in apps.json, so `deploy.yml` can never select
  # it — but its tests and guards DO run.
  - "engine/*"
  - "engine/apps/*"
  # The live 4DL products and the packages they share.
  - "apps/*"
  - "packages/*"
patchedDependencies:
  '@cloudflare/vitest-pool-workers@0.8.55': patches/@cloudflare__vitest-pool-workers@0.8.55.patch
