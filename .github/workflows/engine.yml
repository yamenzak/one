name: OneEngine

# ONE — and, since the legacy workflows were deleted, the only thing this
# repository ships.
#
# ── The legacy tree is FROZEN, not gone ─────────────────────────────────────
#
# `ci.yml`, `deploy.yml` and `provision.yml` are deleted. `apps/` and `packages/`
# are still on disk, because Kova has to be read while it is ported — but nothing
# builds, tests or deploys them any more. Kova's worker goes on serving the
# version last deployed from it; the way to change that is to bring the workflow
# back deliberately, not to push.
#
# ⚠️ AND THAT IS WHY `inert.test.mjs` MATTERS MORE NOW, NOT LESS. Kova is still
# LIVE on this Cloudflare account with a paying tenant on it, and nothing else is
# watching it any more. The guard runs in `pnpm engine:gate` and again below
# before anything is created: it fails if One's worker name collides with a live
# one, if a D1 name does, or if `ROOT` overlaps a hostname a customer answers on.
# That last is the collision nobody sees coming — One serves `*.${ROOT}`, so a
# `ROOT` of `4dl.app` would put One's wildcard over `<slug>.kova.4dl.app`, and
# route precedence rather than intent would decide who answers.
#
# The `paths:` filter below is the other half: a push touching only the frozen
# tree runs nothing at all.
#
# ── Secrets ─────────────────────────────────────────────────────────────────
#
#   CLOUDFLARE_API_TOKEN   — an account token with D1:Edit, to create and deploy
#   CLOUDFLARE_ACCOUNT_ID  — the account id
#
# ⚠️ AND THE WORKER GETS NEITHER. The three WORKER secrets — `AUTH_SECRET`,
# `CONFIG_SECRET`, `VAULT_SECRET` — are minted once by the provision path below
# and never re-put; nothing else is set. One makes no Cloudflare API call at
# runtime and has no code path that could use a token, so putting one in `env`
# would be handing every request handler the account.
#
# ⚠️ EVERY OTHER CREDENTIAL IS PASTED INTO THE CONSOLE, NOT SET HERE. The Stripe
# keys live encrypted in the directory under `CONFIG_SECRET`, which this workflow
# has no way to read — so a repository compromise yields no live merchant
# credential, and rotating one is a form rather than a code push.
#
# ── One branch ──────────────────────────────────────────────────────────────
#
# ⚠️ AND A SECOND ONE HERE IS A SECOND DEPLOY, NOT A SECOND OPINION. `main` and
# `claude/quad` were identical for a while and both were triggers, so every push
# ran the whole gate twice and uploaded the same worker twice — and the
# concurrency group is keyed on the ref, so the two did not even serialise
# against each other. The work is on `main` now, which is the whole of what this
# repository ships.
#
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
      # The root files the engine's build actually depends on. Deliberately NOT a
      # catch-all: a Kova-only change must not mint a One version.
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:
    inputs:
      provision:
        description: "Create the D1 databases One binds, and commit their ids"
        type: boolean
        default: false
      deploy:
        description: "Deploy after the gate passes"
        type: boolean
        default: true

concurrency:
  # NOT cancel-in-progress: the provision path commits resource ids, and a run
  # cancelled between creating a database and writing its id leaves an orphan
  # nobody knows about.
  group: engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── The gate. Credential-free, and nothing below runs without it. ─────────
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before install, and dependency-free on purpose: a check that needs the
      # workspace installed cannot guard the workspace's own install. A broken
      # workflow does not fail — it does not RUN, and GitHub lists it by filename
      # with nothing saying why.
      - run: node .github/workflows/workflows-parse.test.mjs
      # ⚠️ THE ISOLATION CHECK, AND IT RUNS FIRST. Everything else here is about
      # whether OneEngine works; this is about whether OneEngine can reach the deployment a
      # customer is using.
      - run: node engine/scripts/inert.test.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same cache the other workflows keep, same reasoning: turbo keys each task
      # on the content of its inputs, so a package that changed misses and
      # re-runs. A stale cache cannot make a broken commit pass; it can only fail
      # to save time.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm engine:gate
      - run: pnpm engine:typecheck

      # ⚠️ SERIALLY, AND THE FLAG IS LOAD-BEARING. Several Workers-pool suites
      # started at turbo's default concurrency on a two-core runner get one of
      # them KILLED — no assertion, no stack, a `workerd` left orphaned — and
      # `retry` cannot help, because the runtime dies before a test exists to
      # retry.
      - run: pnpm turbo run test --filter='./engine/*' --filter='./engine/apps/*' --concurrency=1

  # ── Create the databases One binds, and write their ids in. ───────────────
  #
  # ⚠️ MANUAL, AND THAT IS DELIBERATE. Find-or-create on a deploy path is safe
  # for a KV namespace, where the worst case is an empty one. A DATABASE is not
  # that: `wrangler d1 create` succeeds under any name it has not seen, so a
  # config whose name had drifted would quietly get a second, empty database —
  # and every request would then succeed against it while the real rows sat
  # somewhere else.
  #
  # Idempotent: it lists first and creates only what is missing. Creating on the
  # basis of a FAILED list is how duplicates get made, so a list that errors
  # stops the job rather than proceeding.
  provision:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.provision
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The BRANCH, not the triggering SHA: this job commits the ids, and a
          # commit built on an older SHA is rejected the moment the branch moves.
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create what is missing, and bind it
        working-directory: engine/one
        run: |
          set -euo pipefail

          # Wrangler prints a version banner to STDOUT before the JSON payload,
          # so `--json | jq` dies with "Invalid numeric literal". Drop everything
          # before the first line that opens an array or object.
          json_only() { awk 'f || /^[[:space:]]*[[{]/ { f = 1; print }'; }

          if ! list=$(pnpm exec wrangler d1 list --json 2>&1 | json_only); then
            echo "::error::Cannot list D1 databases. The API token is probably missing D1:Edit."
            exit 1
          fi

          for name in $(node ../scripts/bind-ids.mjs --names); do
            id=$(printf '%s' "$list" | jq -r --arg n "$name" '.[]? | select(.name == $n) | .uuid' | head -1)
            if [ -z "$id" ]; then
              echo "Creating D1 '$name'…"
              pnpm exec wrangler d1 create "$name" >/dev/null
              id=$(pnpm exec wrangler d1 list --json 2>/dev/null | json_only \
                   | jq -r --arg n "$name" '.[]? | select(.name == $n) | .uuid' | head -1)
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not create or read back D1 '$name'."
              exit 1
            fi
            node ../scripts/bind-ids.mjs "$name" "$id"
          done

      # ⚠️ The guard runs AGAIN, against the file this job just wrote. A binder
      # that wrote a real id into the wrong binding would point the directory at
      # a shard, and every cross-tenant question at one workspace's records.
      - run: node engine/scripts/inert.test.mjs

      # ⚠️ THE DOCUMENT IS REGENERATED IN THE SAME COMMIT, and leaving it out is
      # why the first provision always ended red. `ENGINE.md`'s deployment table
      # is generated FROM this file — it read "2 of 2 are placeholders, so
      # nothing is deployed" — so a job that rewrites the ids and not the block
      # derived from them leaves `docs.test.mjs` failing on the very next run.
      # A generated block is only worth having if whatever moves its source
      # moves it too.
      - name: Record the ids
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- engine/one/wrangler.jsonc; then
            echo "Already bound — nothing to commit."
            exit 0
          fi
          node engine/scripts/docs.test.mjs --write
          git add engine/one/wrangler.jsonc engine/docs/ENGINE.md
          git commit -m "Bind One's D1 databases [skip ci]"
          # A GITHUB_TOKEN push starts no new workflow run, so this cannot loop.
          git push origin HEAD:${{ github.ref_name }}

      # ── The three secrets, each minted once and never re-put. ─────────────
      #
      # ⚠️ RE-PUTTING ANY OF THEM IS DESTRUCTIVE, AND DIFFERENTLY SO FOR EACH.
      # A new AUTH_SECRET invalidates every sign-in code in flight. A new
      # CONFIG_SECRET makes every stored credential unreadable — recoverable by
      # re-pasting them, which is why it is deliberately NOT the vault's. A new
      # VAULT_SECRET is the silent loss of every special-category fact on the
      # deployment, with no error until somebody reads one.
      #
      # ⚠️ AND THEY ARE WORKER SECRETS RATHER THAN REPO ONES, because a repo
      # secret is readable by every workflow run in the repository — including
      # one somebody adds later for something unrelated.
      #
      # ⚠️ MINTED RATHER THAN PASTED, because a value a person chooses is a value
      # a person can retype from memory, and all three are key material.
      - name: Mint the secrets the worker has none of
        working-directory: engine/one
        run: |
          set -uo pipefail
          held=$(pnpm exec wrangler secret list 2>/dev/null || echo "")
          for name in AUTH_SECRET CONFIG_SECRET VAULT_SECRET; do
            if printf '%s' "$held" | grep -q "$name"; then
              echo "::notice::$name already set — leaving it alone."
              continue
            fi
            node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))" \
              | pnpm exec wrangler secret put "$name"
            echo "::notice::Minted $name."
          done

      # ── The three that are PASTED, not minted. ────────────────────────────
      #
      # ⚠️ THESE ARE PUT ON EVERY PROVISION RUN, and that is the difference from
      # the three above. Those are key material: re-putting one is destructive,
      # differently so for each. These are a list of addresses and an account
      # credential — things somebody EDITS, and the way to edit them has to be
      # changing the repository secret and running this again.
      #
      # ⚠️ AND `OPERATOR_EMAILS` IS A BOOTSTRAP DEADLOCK OF ITS OWN. Every key
      # this deployment needs — Stripe, Gemini, a mail provider — is pasted into
      # the operator console, encrypted under CONFIG_SECRET, which no workflow
      # can read. Reaching that console needs an address on this list. With the
      # list empty a live deployment admits NOBODY, which is the honest reading
      # of "unconfigured" and is also a product nobody can finish setting up.
      # The seeded sender below breaks the mail half; this breaks the rest.
      #
      # ⚠️ THE ACCOUNT TOKEN IS SEPARATE FROM THE ONE THIS WORKFLOW DEPLOYS WITH,
      # deliberately. `CLOUDFLARE_API_TOKEN` is a deploy credential that lives in
      # Actions; `CF_API_TOKEN` is what the running worker reconciles resources
      # with, and it wants D1:Edit, KV:Edit, R2:Edit, Queues:Edit and
      # Scripts:Edit and nothing else. Absent is a working deployment — every
      # declared need stays `wanted` and nothing fails.
      - name: Put the secrets somebody has to choose
        working-directory: engine/one
        env:
          OPERATOR_EMAILS: ${{ secrets.ENGINE_OPERATOR_EMAILS }}
          CF_API_TOKEN: ${{ secrets.ENGINE_CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          put() {
            if [ -z "${2:-}" ]; then return 1; fi
            printf '%s' "$2" | pnpm exec wrangler secret put "$1" \
              && echo "::notice::Set $1."
          }

          put OPERATOR_EMAILS "$OPERATOR_EMAILS" || echo "::warning::\
          ENGINE_OPERATOR_EMAILS is not set, so the operator console admits nobody \
          and every key it is the only way to paste stays unset. Add a repository \
          secret with the comma-separated addresses that may open it, then run this \
          workflow again with 'provision' ticked."

          put CF_API_TOKEN "$CF_API_TOKEN" || echo "::notice::\
          ENGINE_CF_API_TOKEN is not set, so the worker will not provision the \
          buckets and queues its products declare. Everything else works; each \
          declared need stays 'wanted' until a scoped token is added."

          put CF_ACCOUNT_ID "$CF_ACCOUNT_ID" || echo "::notice::\
          CLOUDFLARE_ACCOUNT_ID is not set, so the reconciler has no account to \
          act in."

  # ── Deploy. ───────────────────────────────────────────────────────────────
  #
  # `claude/quad` is in the trigger because that is where the work is and there
  # is nothing on the other end to protect yet. Remove it the day One carries a
  # real tenant.
  deploy:
    needs: [gate, provision]
    # `always()` because `provision` is skipped on an ordinary push, and a
    # skipped need would otherwise skip this too. The gate's result is still
    # required — a failed gate must never reach here.
    if: >-
      always() && needs.gate.result == 'success'
      && needs.provision.result != 'failure'
      && github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The BRANCH: `provision` may have just committed the resource ids, and
          # the triggering SHA is the commit before that one.
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # ⚠️ A CONFIG STILL BINDING PLACEHOLDERS IS SKIPPED, NOT FAILED. Deploying
      # against one does not error — wrangler binds *something* — and the worker
      # comes up pointing at nothing, which is a green run and a dead product.
      - id: ready
        run: |
          set -uo pipefail
          if node engine/scripts/bind-ids.mjs --ready; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One is not provisioned — skipping its deploy. Run this workflow with 'provision' ticked."
          fi

      # The worker serves `engine/one-space/dist` through its `assets` binding, and
      # an `assets.directory` is a filesystem path rather than a package
      # dependency. `turbo.json` declares the edge for the TEST task; the deploy
      # needs it built here too.
      - name: Build the Hub
        if: steps.ready.outputs.go == 'true'
        run: pnpm turbo run build --filter=@engine/space

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/one
          command: deploy

      # ⚠️ "DEPLOYED" IS NOT "WORKING", and only a request tells them apart. The
      # `ready` step above asks whether the CONFIG is real; it is blind to a
      # worker that deploys perfectly and throws on every request. A hostname
      # that does not resolve yet is a notice — DNS and the routes are dashboard
      # steps — while one that resolves and answers wrongly is a failure.
      - name: Verify it can actually boot
        if: steps.ready.outputs.go == 'true'
        run: node engine/scripts/boot-check.mjs

      # ── Break the bootstrap deadlock. ─────────────────────────────────────
      #
      # ⚠️ NO SCREEN CAN DO THIS, AND THAT IS THE POINT. Setting the sender needs
      # the operator console; reaching the console needs a session; a session
      # needs a sign-in code; a code needs mail; mail needs the sender. A fresh
      # deployment cannot be signed into at all, and the console it is waiting
      # for is behind the lock it is holding. A workflow with database access can
      # do what a page behind a login cannot.
      #
      # ⚠️ `ON CONFLICT DO NOTHING`, NEVER AN UPSERT. This runs on every deploy,
      # and an upsert would reset whatever an operator had configured — silently,
      # every time anybody shipped anything.
      #
      # ⚠️ AND THE TABLE EXISTS BY NOW BECAUSE THE BOOT CHECK ABOVE MADE A
      # REQUEST. The worker applies its schema on the first one, so the order of
      # these two steps is load-bearing rather than cosmetic.
      #
      # Neither value is a secret, so neither is encrypted: an address and the
      # word `cloudflare`. The keys that ARE secret cannot be seeded from here
      # and are not — they are pasted into the console, encrypted under
      # CONFIG_SECRET, which this workflow has no way to read.
      # ⚠️ `always()`, AND IT IS THE WHOLE POINT OF THE STEP. A step whose `if:`
      # names no status function has `success()` ANDed into it — so this one was
      # skipped whenever the boot check above failed. The boot check fails on
      # exactly one deployment: a fresh one, whose DNS and routes are dashboard
      # steps that come AFTER the first deploy. The step that exists to break the
      # bootstrap deadlock was gated behind the only condition under which the
      # deadlock exists, and the symptom was a sign-in that answered
      # `platform.unavailable` with no sender row anywhere.
      - name: Seed the sender, so the first person can sign in
        if: always() && steps.ready.outputs.go == 'true'
        working-directory: engine/one
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          pnpm exec wrangler d1 execute one-directory --remote --command \
            "INSERT INTO deployment_config (key, value, salt, iv, at)
             VALUES ('email.provider', 'cloudflare', NULL, NULL, datetime('now')),
                    ('email.from', 'One <noreply@4dl.app>', NULL, NULL, datetime('now'))
             ON CONFLICT(key) DO NOTHING;" \
            || echo "::warning::Could not seed the sender. Set it in the console: Keys → Email."

