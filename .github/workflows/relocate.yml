# MOVING A DATABASE TO WHERE IT SHOULD HAVE BEEN MADE.
#
# ⚠️ A D1'S PLACE IS FIXED AT CREATION AND CANNOT BE EDITED. There is no setting,
# no migration and no ticket — so "put the directory in Europe" is a new
# database, a copy, and a rebind. The seed databases were made by a bare
# `wrangler d1 create` in a CI runner, which is why every operation on this
# deployment spends four to six sequential round trips at ~260 ms each against a
# worker using nine milliseconds of CPU. See DECISIONS.md D64.
#
# ⚠️ THE SHARDS DO NOT USE THIS, AND MUST NOT. A workspace moves shard to shard
# through `op.tenant.move`, which holds that one workspace read-only while it
# copies, derives the tables from the erasure ledger and deletes nothing from the
# source — no downtime for anybody else, one workspace at a time, already built
# and already tested. Add a correctly-placed shard to `SHARDS`, let provisioning
# create it, and move workspaces onto it. This workflow is for the DIRECTORY,
# which is not a shard: there is one, everything depends on it, and nothing can
# move a workspace off it.
#
# ⚠️ A COPY TAKEN FROM A LIVE DATABASE LOSES EVERY ROW WRITTEN AFTER THE TABLE
# WAS READ — silently, with no error, discovered weeks later as records that went
# missing. So `relocate` refuses to run unless the deployment is already in
# maintenance, and it checks by reading the switch rather than trusting whoever
# typed the input.
#
# ⚠️ AND IT NEVER DELETES THE OLD ONE. A relocation that emptied the source is
# unrecoverable the moment the copy turns out to have been wrong, and "the copy
# was wrong" is a thing you learn afterwards or not at all.
name: Relocate a database

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "rehearse (copy and compare, bind nothing) or relocate (bind and deploy)"
        required: true
        default: rehearse
        type: choice
        options: [rehearse, relocate]
      # ⚠️ BINDINGS, NOT DATABASE NAMES, AND THE NEW NAME IS NOT ASKED FOR.
      # `DIRECTORY` and `SHARD_EU_1` are what the worker reads and they never
      # change, while a database's NAME changes every time it is relocated — so
      # addressing this by name is addressing it by the one thing this workflow
      # invalidates. And a name typed by a person is a name that claims
      # something: the first one chosen here was `one-directory-eu`, which reads
      # as a jurisdiction the directory deliberately does not have (Cloudflare:
      # a location hint "does not set a jurisdiction"). `-g2` says the one true
      # thing — which copy this is.
      bindings:
        description: "Which bindings to relocate, comma-separated (e.g. DIRECTORY,SHARD_EU_1)"
        required: true
        default: DIRECTORY,SHARD_EU_1
        type: string

concurrency: relocate-one

# ⚠️ THE LAST STEP WRITES TO THE REPOSITORY, so the job needs to be allowed to.
# Without this the default token is read-only and the push is refused 403 — after
# the copy, after the deploy, after the boot check, with the deployment already
# LIVE on the new database and the repository still naming the old one. The next
# ordinary push then re-deploys the old id and silently moves the deployment back
# onto a database that has been out of service since the window. The relocation
# succeeded and the record of it did not, which is the worst of the two halves to
# lose.
permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/one
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # ⚠️ BEFORE ANYTHING TOUCHES CLOUDFLARE, AND IN BOTH PHASES. The worker
      # serves `engine/one-space/dist` through its `assets` binding, and an
      # `assets.directory` is a filesystem path rather than a package dependency
      # — so nothing in the graph connects a deploy to the build it needs. Left
      # out, `wrangler deploy` fails on a missing directory at the END of the
      # sequence: the copy taken, the id written, the deployment in maintenance
      # and a person waiting on a failure that had nothing to do with any of it.
      # Built here, that is a red run in twenty seconds with nothing bound.
      - name: Build the Hub
        run: pnpm turbo run build --filter=@engine/space
        working-directory: .

      # ⚠️ THE SWITCH IS READ, NOT ASKED ABOUT. An input saying "yes I turned
      # maintenance on" is a promise; this is the deployment's own answer, out of
      # the database about to be copied — and asked of the ID the worker is
      # actually bound to, never of a name in the config that a past relocation
      # may already have superseded.
      - name: Refuse to copy a database that is still being written to
        if: inputs.phase == 'relocate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mode=$(node ../scripts/d1.mjs "$(node ../scripts/bind-ids.mjs --id DIRECTORY)" \
            "SELECT mode FROM maintenance WHERE id = 'the'" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].results[0]?.mode ?? "off"')
          echo "maintenance is: $mode"
          if [ "$mode" != "readonly" ] && [ "$mode" != "full" ]; then
            echo "::error::The deployment is still accepting writes. Turn maintenance on"
            echo "::error::from the operator console first — a copy taken from a live"
            echo "::error::database loses every row written after each table was read."
            exit 1
          fi

      # ⚠️ EVERY DATABASE IS COPIED AND VERIFIED BEFORE ANY OF THEM IS BOUND.
      # One window, several databases, and a difference found in the second one
      # must not leave the first already rebound — so this step only records what
      # it made, and `--rebind` happens once, after all of them passed.
      #
      # ⚠️ THE SOURCE IS THE BOUND ID, NEVER THE CONFIGURED NAME. `wrangler d1`
      # resolves a name against the account, so a config whose name is one
      # relocation behind sends the copy to the superseded database — which is
      # exactly what a second run would have done.
      #
      # ⚠️ AND THE PLACE COMES FROM THE DECLARATION, as provisioning's does. A
      # flag typed here would be the second answer this whole round removed.
      - name: Copy each one, and check it is the same database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : > /tmp/relocated
          for binding in $(echo "${{ inputs.bindings }}" | tr ',' ' '); do
            from=$(node ../scripts/bind-ids.mjs --id "$binding")
            to=$(node ../scripts/bind-ids.mjs --next "$binding")
            place=$(node ../scripts/bind-ids.mjs --placeof "$binding")
            echo "::group::$binding — $from → $to ($place)"

            # shellcheck disable=SC2086
            pnpm exec wrangler d1 create "$to" $place

            pnpm exec wrangler d1 export "$from" --remote --output "/tmp/$binding.sql"
            wc -c "/tmp/$binding.sql"
            pnpm exec wrangler d1 execute "$to" --remote --file "/tmp/$binding.sql"

            # ⚠️ The list is each database's own, and `d1.mjs` is what asks — a
            # table added tomorrow is counted because it is there, D1's internal
            # tables are left out because they cannot be counted at all, and a
            # refused query is PRINTED rather than captured into the file.
            node ../scripts/d1.mjs --counts "$from" > "/tmp/from-$binding.json"
            node ../scripts/d1.mjs --counts "$to"   > "/tmp/to-$binding.json"
            node ../scripts/copied.mjs "/tmp/from-$binding.json" "/tmp/to-$binding.json"

            list=$(pnpm exec wrangler d1 list --json) || { echo "$list"; exit 1; }
            uuid=$(printf '%s' "$list" | node -pe 's=require("fs").readFileSync(0,"utf8");(JSON.parse(s.slice(s.indexOf("["))).find(r=>r.name===process.argv[1])||{}).uuid??""' "$to")
            [ -n "$uuid" ] || { echo "::error::Cannot read back the id of $to. wrangler said:"; echo "$list"; exit 1; }
            echo "$binding $to $uuid" >> /tmp/relocated
            echo "::endgroup::"
          done
          echo "Copied and verified:"; cat /tmp/relocated

      # ⚠️ A REHEARSAL THAT ONLY REHEARSES THE COPY IS NOT A REHEARSAL. The copy
      # is the part with a rollback; the DEPLOY is the part with a person waiting
      # on it, and it is the one that failed — on a missing assets directory, at
      # the end of a maintenance window, over something that had nothing to do
      # with the database. A dry run resolves the config, the bindings and the
      # assets without shipping anything, so every way the last step can fail is
      # found while nothing is bound and nobody is held.
      - name: Prove the deploy would work
        if: inputs.phase == 'rehearse'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --dry-run

      # ⚠️ A REHEARSAL STOPS HERE, HOLDING REAL COPIES IN THE RIGHT PLACES. It
      # has proved the export, the import and the comparison against the live
      # data, and told you how long the window is — which is the only honest way
      # to know before the deployment is down.
      - name: What a rehearsal leaves behind
        if: inputs.phase == 'rehearse'
        run: |
          echo "::notice::Rehearsed. Every copy below is real, verified and in the"
          echo "::notice::declared place, and NOTHING is bound to any of them."
          echo "::notice::Delete them, then re-run with phase=relocate under"
          echo "::notice::maintenance."
          cat /tmp/relocated

      # ⚠️ ALL OF THEM, THEN ONE DEPLOY. A rebind per database with a deploy each
      # would leave the deployment briefly reading a new directory and an old
      # shard, which is a state nothing here is designed for and nothing tests.
      - name: Bind them and ship
        if: inputs.phase == 'relocate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # ⚠️ THE BINDING KEEPS ITS NAME. `DIRECTORY` and `SHARD_EU_1` are what
          # every module reads; only the database behind them moves, so nothing
          # in the worker knows this happened — which is what makes it
          # revertible by one more commit.
          while read -r binding name uuid; do
            node ../scripts/bind-ids.mjs --rebind "$binding" "$name" "$uuid"
          done < /tmp/relocated
          node ../scripts/bind-ids.mjs --ready
          pnpm exec wrangler deploy

      # ⚠️ THE SAME PROBE THE ORDINARY DEPLOY USES, and it asks more than once —
      # a version that answers the API and not the door is the failure a single
      # 200 misses. See `boot-check.mjs`.
      - name: Verify it can actually boot
        if: inputs.phase == 'relocate'
        run: node ../scripts/boot-check.mjs

      # ⚠️ COMMITTED LAST, AND ONLY AFTER IT BOOTED. The id in the repository is
      # what the next ordinary deploy will use; committing it before the deploy
      # worked would make the next push to main quietly re-point the deployment
      # at a database nobody has verified.
      - name: Remember which databases these are now
        if: inputs.phase == 'relocate'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "One: relocated ${{ inputs.bindings }}" || exit 0
          git push

      - name: What is still to do
        if: inputs.phase == 'relocate'
        run: |
          echo "::notice::Bound and deployed. Turn maintenance OFF from the console,"
          echo "::notice::then watch the logs: wallTimeMs should fall by roughly the"
          echo "::notice::round-trip count per request. The OLD database is untouched"
          echo "::notice::and is the way back — delete it only once you are satisfied."
