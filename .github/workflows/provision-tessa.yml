name: Provision Tessa on Cloudflare

# Creates the D1 database / KV namespace / R2 bucket the Tessa worker binds to,
# WRITES THE IDS BACK into apps/tessa/wrangler.jsonc, and mints the worker's
# BETTER_AUTH_SECRET. Actions tab → this workflow → Run workflow.
#
# ── Why this writes the config instead of printing it ───────────────────────
#
# Kova's provision.yml prints the ids into the run summary and asks you to paste
# them. That is one manual step too many on the one file where a typo is worst:
# a wrong id does not error, it binds the worker to an empty database. Since the
# workflow already knows the ids it just created, it commits them.
#
# ── Idempotent, and the guards are load-bearing ─────────────────────────────
#
# Every action is guarded by an existence check, so a re-run is a no-op. The
# reason is the same one Kova's file documents at length:
#   • `wrangler kv namespace create` does NOT dedupe by title — a second run
#     silently adds a SECOND namespace, and binding its id points the worker at
#     an empty cache.
#   • `wrangler d1 create` succeeds under any unseen name, so a drifted config
#     would quietly create a second, empty database.
# A permissions failure and "not found" must not look alike either: creating on
# the basis of a failed `list` is how duplicates get made.

on:
  workflow_dispatch:

# The write-back needs this. Nothing else in the repo grants it.
permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: tessa
      KV_TITLE: CACHE
      R2_BUCKET: tessa-media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create what is missing, and write the ids into wrangler.jsonc
        working-directory: apps/tessa
        run: |
          set -uo pipefail

          # Wrangler prints a version banner to STDOUT before the JSON payload, so
          # `--json | jq` dies with "Invalid numeric literal at line 2". Drop
          # everything before the first line that opens an array or object.
          # Without this every existence check silently reports "missing" and the
          # workflow creates duplicates of things that already exist.
          json_only() { awk 'f || /^[[:space:]]*[[{]/ { f = 1; print }'; }

          require_list() {
            local what="$1"; shift
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error::Cannot list $what. The API token is missing a permission."
              echo "$out" | tail -5
              echo "Add the matching *:Edit scope at https://dash.cloudflare.com/profile/api-tokens"
              return 1
            fi
            printf '%s' "$out" | json_only
          }

          fail=0

          # ── D1 ──────────────────────────────────────────────────────────────
          # Matched by NAME here, unlike Kova's — Tessa has never been deployed,
          # so there is no pre-rename database whose name has drifted from the
          # product. The moment a real id is in the config, the check below flips
          # to verifying that id, which is the stronger test.
          want_d1=$(grep -oE '"database_id"[[:space:]]*:[[:space:]]*"[^"]*"' wrangler.jsonc | head -1 | sed -E 's/.*"([^"]*)"$/\1/')
          placeholder_d1='00000000-0000-0000-0000-0000000000d1'

          if d1=$(require_list "D1 databases" pnpm exec wrangler d1 list --json); then
            if [ "$want_d1" != "$placeholder_d1" ] && printf '%s' "$d1" | jq -e --arg id "$want_d1" '.[]? | select((.uuid // .id) == $id)' >/dev/null; then
              echo "✓ D1 $want_d1 exists and is what wrangler.jsonc binds."
              D1_ID="$want_d1"
            elif [ "$want_d1" != "$placeholder_d1" ]; then
              # A configured REAL id the account does not have is not a fresh
              # start — it is a config pointing at a deleted or foreign database.
              # Creating one here would hide that behind a green run.
              echo "::error::wrangler.jsonc binds D1 id $want_d1, which this account does not have."
              echo "Either this is the wrong account, or the database was deleted."
              fail=1
            elif existing=$(printf '%s' "$d1" | jq -r --arg n "$D1_NAME" '.[]? | select(.name == $n) | (.uuid // .id)' | head -1) && [ -n "$existing" ]; then
              echo "✓ D1 '$D1_NAME' already exists ($existing) — adopting it."
              D1_ID="$existing"
            else
              echo "Creating D1 '$D1_NAME'…"
              pnpm exec wrangler d1 create "$D1_NAME" >/dev/null 2>&1 || fail=1
              D1_ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | json_only | jq -r --arg n "$D1_NAME" '.[]? | select(.name == $n) | (.uuid // .id)' | head -1)
              [ -n "$D1_ID" ] || { echo "::error::Created D1 but could not read its id back."; fail=1; }
            fi
          else
            fail=1
          fi

          # ── KV ──────────────────────────────────────────────────────────────
          # Wrangler titles the namespace "<worker>-<binding>", so match the suffix.
          if kv=$(require_list "KV namespaces" pnpm exec wrangler kv namespace list); then
            KV_ID=$(printf '%s' "$kv" | jq -r --arg t "$KV_TITLE" '.[]? | select(.title | endswith($t)) | .id' | head -1)
            if [ -n "$KV_ID" ]; then
              echo "✓ KV namespace ending in '$KV_TITLE' exists ($KV_ID)."
            else
              echo "Creating KV namespace '$KV_TITLE'…"
              pnpm exec wrangler kv namespace create "$KV_TITLE" >/dev/null 2>&1 || fail=1
              KV_ID=$(pnpm exec wrangler kv namespace list 2>/dev/null | json_only | jq -r --arg t "$KV_TITLE" '.[]? | select(.title | endswith($t)) | .id' | head -1)
              [ -n "$KV_ID" ] || { echo "::error::Created KV but could not read its id back."; fail=1; }
            fi
          else
            fail=1
          fi

          # ── R2 ──────────────────────────────────────────────────────────────
          # No id to write back: R2 genuinely binds by NAME, so the config is
          # already correct and only the bucket has to exist.
          echo "Ensuring R2 bucket '$R2_BUCKET'…"
          if out=$(pnpm exec wrangler r2 bucket create "$R2_BUCKET" 2>&1); then
            echo "✓ Created R2 bucket '$R2_BUCKET'."
          elif printf '%s' "$out" | grep -qiE "already (exists|owned)|10004"; then
            echo "✓ R2 bucket '$R2_BUCKET' already exists."
          else
            echo "::error::Could not create R2 bucket '$R2_BUCKET'."
            printf '%s' "$out" | tail -5
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

          # ── Write the ids in ────────────────────────────────────────────────
          # Anchored to the binding's own line so nothing else in the file can be
          # rewritten by accident. Verified after the fact rather than trusted:
          # a sed that matched nothing exits 0 and would leave the placeholders
          # in place behind a green run.
          sed -i -E "s#(\"database_id\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")#\1${D1_ID}\2#" wrangler.jsonc
          sed -i -E "s#(\"binding\"[[:space:]]*:[[:space:]]*\"CACHE\"[^}]*\"id\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")#\1${KV_ID}\2#" wrangler.jsonc

          grep -q "$D1_ID" wrangler.jsonc || { echo "::error::Failed to write the D1 id into wrangler.jsonc."; exit 1; }
          grep -q "$KV_ID" wrangler.jsonc || { echo "::error::Failed to write the KV id into wrangler.jsonc."; exit 1; }
          echo "✓ wrangler.jsonc now binds D1 $D1_ID and KV $KV_ID."

      - name: Commit the ids
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/tessa/wrangler.jsonc; then
            echo "Nothing changed — already provisioned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/tessa/wrangler.jsonc
          # Two -m flags rather than one multi-line string: inside a YAML block
          # scalar every line must stay indented, and a message body at column 0
          # silently ends the block — which makes the whole workflow file
          # unparseable and GitHub list it by filename instead of by name.
          git commit \
            -m "Tessa: bind the real Cloudflare resource ids" \
            -m "Written by the provisioning workflow, which created or adopted them. Replaces the placeholders that let wrangler dev run with no Cloudflare account."
          # ⚠️ This push does NOT trigger the Deploy workflow.
          #
          # GitHub deliberately suppresses workflow runs for pushes made with the
          # built-in GITHUB_TOKEN — it is loop prevention, and it is silent: the
          # commit lands, no run appears, and nothing says why. The first version
          # of this file claimed the opposite in a comment, so provisioning
          # "succeeded" and no worker was ever created.
          #
          # Hence the deploy step below. It does not rely on the push at all.
          git push

      # The worker itself. Must come BEFORE minting the secret: `wrangler secret
      # list` has nothing to read until the worker exists, and on a first run
      # that read failing is exactly the "leave it alone" branch below.
      - name: Build Tessa's SPA
        run: pnpm --filter @tessa/app build

      - name: Deploy the Tessa worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tessa
          command: deploy

      - name: Mint BETTER_AUTH_SECRET if the worker has none
        working-directory: apps/tessa
        run: |
          set -uo pipefail
          json_only() { awk 'f || /^[[:space:]]*[[{]/ { f = 1; print }'; }

          # Set ONCE, never rotated: re-putting it re-signs every session cookie
          # and signs every user out. Guarded three ways — a FAILED read must
          # never be mistaken for "no secret set", because that mistake rotates a
          # live key. Before the first deploy the worker does not exist, so a
          # failure here is normal; re-run after deploying.
          if ! out=$(pnpm exec wrangler secret list --format json 2>&1); then
            echo "⚠️  Could not read the worker's secrets — leaving BETTER_AUTH_SECRET alone."
            echo "   Normal before Tessa's first deploy. Re-run this workflow afterwards."
            exit 0
          fi
          if printf '%s' "$out" | json_only | jq -e '.[]? | select(.name == "BETTER_AUTH_SECRET")' >/dev/null; then
            echo "✓ Already set — not touching it (rotating it signs everyone out)."
            exit 0
          fi
          echo "Minting BETTER_AUTH_SECRET…"
          openssl rand -base64 32 | pnpm exec wrangler secret put BETTER_AUTH_SECRET
          echo "✓ Set. Random, never printed; nothing but the worker reads it."

      - name: What is left
        if: always()
        run: |
          {
            echo "## Tessa provisioning"
            echo ""
            echo "Resources created, \`apps/tessa/wrangler.jsonc\` committed with the real"
            echo "ids, and the worker deployed. Every later push to main redeploys it."
            echo ""
            echo "Still manual, and neither can be automated:"
            echo ""
            echo "1. **Email.** A fresh deployment cannot send a sign-in code until"
            echo "   \`email.provider\` and \`email.from\` are seeded directly in D1."
            echo "   Reaching the operator console needs a session, which needs an OTP,"
            echo "   which needs email — no UI can break that deadlock. See Kova's"
            echo "   DEPLOY.md §6 for the rows."
            echo "2. **Routes.** Add \`<root>/*\` and \`*.<root>/*\` in the Cloudflare"
            echo "   dashboard. They are deliberately absent from wrangler.jsonc:"
            echo "   declaring them makes \`wrangler dev\` rewrite the Host and collapse"
            echo "   all five doors onto the root."
          } >> "$GITHUB_STEP_SUMMARY"
