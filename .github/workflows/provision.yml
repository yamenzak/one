name: Provision an app on Cloudflare

# ONE workflow for every app in this monorepo. Actions tab → this workflow →
# Run workflow → type the app id from `apps.json` (kova, tessa, …).
#
# It takes an app from "nothing on the account" to "reachable, and able to send
# its first sign-in code", in one run and with no copy-paste:
#
#   1. creates the D1 database / KV namespace / R2 bucket it binds, if missing
#   2. WRITES the real ids into its wrangler.jsonc and commits them
#   3. builds its SPA and deploys the worker
#   4. mints BETTER_AUTH_SECRET, but only if the worker has none
#   5. seeds email delivery so the bootstrap deadlock is already broken
#
# There used to be two of these — provision.yml for Kova and a copy for Tessa,
# which had already drifted apart by the time it first ran. Every app-specific
# fact here comes from `apps.json`, so a THIRD app needs no edit to this file.
#
# ── Idempotent, and the guards are load-bearing ─────────────────────────────
#
# Every action is guarded by an existence check, so a re-run is a no-op. The
# original `create … || true` was unsafe in three specific ways:
#   • `wrangler kv namespace create` does NOT dedupe by title — a second run
#     silently adds a SECOND namespace, and binding its id points the worker at
#     an empty cache.
#   • `wrangler d1 create` succeeds under any name it has not seen, so a config
#     whose name had drifted would quietly create a second, empty database.
#   • a permissions failure and "not found" look identical to `|| true`, and
#     creating on the basis of a failed `list` is how duplicates get made.
#
# ── What it will NOT do ─────────────────────────────────────────────────────
#
# Rotate BETTER_AUTH_SECRET (it re-signs every session cookie and signs every
# user out), overwrite an email sender that is already configured, or create a
# database when the config names a real id the account does not have — that last
# one is a config pointing at a deleted or foreign database, and creating a new
# one would hide it behind a green run.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id from apps.json — e.g. kova, tessa"
        required: true
        type: string

# The id write-back needs this. Nothing else in the repo grants it.
permissions:
  contents: write

concurrency:
  # Two runs against one app would race on the wrangler.jsonc commit.
  group: provision-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Never interpolated into a shell command. `${{ }}` is substituted before
      # bash sees the line, so a `;` in an input would run as a command.
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      # Before install, and dependency-free, for the same reason CI runs them
      # there: a check that needs the workspace installed cannot guard it. A
      # broken workflow does not fail, it does not RUN.
      - run: node .github/workflows/workflows-parse.test.mjs
      - run: node scripts/apps-manifest.test.mjs

      # An unknown id fails HERE, before anything is created, and the error
      # lists the ids that do exist.
      - name: Resolve the app
        id: app
        run: |
          set -euo pipefail
          a=$(node scripts/apps.mjs get "$APP")
          get() { printf '%s' "$a" | jq -r "$1 // empty"; }
          if [ -z "$(get .provision)" ]; then
            echo "::error::\"$APP\" declares no Cloudflare resources in apps.json — there is nothing to provision."
            exit 1
          fi
          {
            echo "dir=$(get .dir)"
            echo "spa=$(get .spa)"
            echo "name=$(get .name)"
            echo "d1=$(get .provision.d1)"
            echo "kv=$(get .provision.kv)"
            echo "r2=$(get .provision.r2)"
            echo "email=$(get .email.name)"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create what is missing
        id: create
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          D1_NAME: ${{ steps.app.outputs.d1 }}
          KV_TITLE: ${{ steps.app.outputs.kv }}
          R2_BUCKET: ${{ steps.app.outputs.r2 }}
        run: |
          set -uo pipefail

          # Wrangler prints its version banner to STDOUT before the JSON
          # payload, so `--json | jq` dies with "Invalid numeric literal at line
          # 2". Drop everything before the first line that opens an array or
          # object. Without this every existence check silently reports
          # "missing" and the workflow creates duplicates of live resources.
          json_only() { awk 'f || /^[[:space:]]*[[{]/ { f = 1; print }'; }

          # A permissions failure and "not found" must not look alike: `list`
          # failing means the token is missing a scope, and creating on that
          # basis either errors confusingly or makes a duplicate.
          require_list() {
            what="$1"; shift
            if ! out=$("$@" 2>&1); then
              echo "::error::Cannot list $what. The API token is missing a permission."
              printf '%s' "$out" | tail -5
              echo "Add the matching *:Edit scope at https://dash.cloudflare.com/profile/api-tokens"
              return 1
            fi
            printf '%s' "$out" | json_only
          }

          bound=$(node ../../scripts/apps.mjs bound "$APP")
          field() { printf '%s' "$bound" | jq -r ".$1"; }
          fail=0

          # ── D1 ────────────────────────────────────────────────────────────
          # Three cases, and the middle one is why this is not a one-liner:
          #   real id, present on the account  → verified, adopt it
          #   real id, ABSENT from the account → ERROR, do not create
          #   placeholder                      → adopt by name, else create
          #
          # The middle case matters because a name check would report "missing"
          # for a perfectly good database whose name has drifted (D1 has no
          # rename API, so a database keeps whatever it was created under — and
          # Kova's predates the product rename). Verifying the id proves the
          # thing the worker actually binds.
          want=$(field d1)
          if d1=$(require_list "D1 databases" pnpm exec wrangler d1 list --json); then
            # `.uuid` is what Cloudflare's D1 list returns; `.id` is a fallback
            # so a field rename cannot turn this into a silent "missing".
            found=$(printf '%s' "$d1" | jq -r --arg id "$want" '.[]? | select((.uuid // .id) == $id) | (.uuid // .id)' | head -1)
            if [ "$(field d1Real)" = "true" ] && [ -n "$found" ]; then
              echo "✓ D1 $want exists and is what wrangler.jsonc binds."
              D1_ID="$want"
            elif [ "$(field d1Real)" = "true" ]; then
              echo "::error::wrangler.jsonc binds D1 id $want, which this account does not have."
              echo "Either this is the wrong Cloudflare account, or the database was deleted."
              fail=1
            elif adopt=$(printf '%s' "$d1" | jq -r --arg n "$D1_NAME" '.[]? | select(.name == $n) | (.uuid // .id)' | head -1) && [ -n "$adopt" ]; then
              echo "✓ D1 '$D1_NAME' already exists ($adopt) — adopting it."
              D1_ID="$adopt"
            else
              echo "Creating D1 '$D1_NAME'…"
              pnpm exec wrangler d1 create "$D1_NAME" >/dev/null 2>&1 || fail=1
              D1_ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | json_only | jq -r --arg n "$D1_NAME" '.[]? | select(.name == $n) | (.uuid // .id)' | head -1)
              [ -n "$D1_ID" ] || { echo "::error::Created D1 '$D1_NAME' but could not read its id back."; fail=1; }
            fi
          else
            fail=1
          fi

          # ── KV ────────────────────────────────────────────────────────────
          # Wrangler titles the namespace "<worker>-<binding>", so match the
          # suffix. The config carries only an id, so there is no name to drift.
          # Guarded on a non-empty title: `endswith("")` matches EVERY namespace,
          # so an app that declares no KV would otherwise adopt a stranger's.
          KV_ID=""
          if [ -z "$KV_TITLE" ]; then
            echo "No KV declared for $APP — skipping."
          elif kv=$(require_list "KV namespaces" pnpm exec wrangler kv namespace list); then
            KV_ID=$(printf '%s' "$kv" | jq -r --arg t "$KV_TITLE" '.[]? | select(.title | endswith($t)) | .id' | head -1)
            if [ -n "$KV_ID" ]; then
              echo "✓ KV namespace ending in '$KV_TITLE' exists ($KV_ID)."
            else
              echo "Creating KV namespace '$KV_TITLE'…"
              pnpm exec wrangler kv namespace create "$KV_TITLE" >/dev/null 2>&1 || fail=1
              KV_ID=$(pnpm exec wrangler kv namespace list 2>/dev/null | json_only | jq -r --arg t "$KV_TITLE" '.[]? | select(.title | endswith($t)) | .id' | head -1)
              [ -n "$KV_ID" ] || { echo "::error::Created KV '$KV_TITLE' but could not read its id back."; fail=1; }
            fi
          else
            fail=1
          fi

          # ── R2 ────────────────────────────────────────────────────────────
          # No id to write back: R2 binds by NAME, so the config is already
          # right and only the bucket has to exist. "Already exists" is fine —
          # but it must not be confused with a permissions error, which the old
          # `|| true` swallowed.
          if [ -n "$R2_BUCKET" ]; then
            echo "Ensuring R2 bucket '$R2_BUCKET'…"
            if out=$(pnpm exec wrangler r2 bucket create "$R2_BUCKET" 2>&1); then
              echo "✓ Created R2 bucket '$R2_BUCKET'."
            elif printf '%s' "$out" | grep -qiE "already (exists|owned)|10004"; then
              echo "✓ R2 bucket '$R2_BUCKET' already exists."
            else
              echo "::error::Could not create R2 bucket '$R2_BUCKET'."
              printf '%s' "$out" | tail -5
              fail=1
            fi
          fi

          [ "$fail" -eq 0 ] || exit 1
          {
            echo "d1_id=$D1_ID"
            echo "kv_id=$KV_ID"
          } >> "$GITHUB_OUTPUT"

      # Structural, verified, and LOUD on failure — see the script's header for
      # why this is not two `sed -i` lines.
      - name: Write the ids into wrangler.jsonc
        run: node scripts/bind-resource-ids.mjs "$APP" --d1 "${{ steps.create.outputs.d1_id }}" --kv "${{ steps.create.outputs.kv_id }}"

      - name: Commit them
        env:
          DIR: ${{ steps.app.outputs.dir }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DIR/wrangler.jsonc"; then
            echo "Nothing changed — already provisioned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR/wrangler.jsonc"
          # Two -m flags rather than one multi-line string: inside a YAML block
          # scalar every line must stay indented, and a message body at column 0
          # silently ends the block — which makes the whole file unparseable and
          # GitHub list it by filename instead of by name. That is exactly how
          # the Tessa copy of this workflow shipped dead.
          git commit \
            -m "$APP: bind the real Cloudflare resource ids" \
            -m "Written by the provisioning workflow, which created or adopted them. Replaces the placeholders that let wrangler dev run with no Cloudflare account."
          # ⚠️ This push does NOT trigger the Deploy workflow.
          #
          # GitHub suppresses workflow runs for pushes made with the built-in
          # GITHUB_TOKEN — loop prevention, and it is silent: the commit lands,
          # no run appears, and nothing says why. An earlier comment here
          # claimed the opposite, so provisioning "succeeded" and no worker was
          # ever created. Hence the deploy step below, which relies on no push.
          git push

      # The worker itself. It must exist before the two steps after it: `secret
      # list` has nothing to read until it does, and the email seed writes to a
      # database the deploy has just bound.
      - name: Build its SPA
        if: steps.app.outputs.spa != ''
        run: pnpm --filter ${{ steps.app.outputs.spa }} build

      - name: Deploy the worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ steps.app.outputs.dir }}
          command: deploy

      # ── The one thing a fresh deploy cannot do for itself ──────────────────
      #
      # `@4dl/email` fails closed until `email.provider` and `email.from` are
      # set, and the console that edits them needs a platform-admin session,
      # which needs an OTP, which needs email. That is a real bootstrap deadlock
      # (DEPLOY.md §6) that no UI can break — but a workflow with database
      # access can, which is the whole reason this step exists.
      #
      # The SQL is generated, not written here: ONE platform sender
      # (noreply@4dl.app) with a per-app display name, so a new app inherits an
      # address that is already onboarded instead of a plausible-looking dead
      # one. It is `ON CONFLICT DO NOTHING` — an automation that upserts would
      # reset a live deployment's configured sender on every re-run.
      - name: Seed email delivery, breaking the bootstrap deadlock
        if: steps.app.outputs.email != ''
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          set -euo pipefail
          sql=$(node ../../scripts/apps.mjs email-sql "$APP")
          binding=$(node ../../scripts/apps.mjs bound "$APP" | jq -r .d1Binding)
          pnpm exec wrangler d1 execute "$binding" --remote --yes --command "$sql"
          echo "::notice::Sender seeded. It must be VERIFIED in Cloudflare → Email → Email Sending, or nothing delivers."

      - name: Mint BETTER_AUTH_SECRET if the worker has none
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          set -uo pipefail
          json_only() { awk 'f || /^[[:space:]]*[[{]/ { f = 1; print }'; }

          # Set ONCE, never rotated: re-putting it re-signs every session cookie
          # and signs every user out. That is also why the Deploy workflow
          # refuses to touch secrets at all. Guarded three ways here:
          #
          #   1. If listing FAILS we do nothing. A failed read must never be
          #      mistaken for "no secret set" — that mistake rotates a live key.
          #   2. If the secret is present, leave it alone.
          #   3. Only a confirmed-absent secret is minted.
          #
          # The value is random and never printed. Nothing but the worker reads it.
          if ! out=$(pnpm exec wrangler secret list --format json 2>&1); then
            echo "⚠️  Could not read the worker's secrets — leaving BETTER_AUTH_SECRET alone."
            printf '%s' "$out" | tail -3
            exit 0
          fi
          if printf '%s' "$out" | json_only | jq -e '.[]? | select(.name == "BETTER_AUTH_SECRET")' >/dev/null; then
            echo "✓ Already set — not touching it (rotating it signs everyone out)."
            exit 0
          fi
          echo "Minting BETTER_AUTH_SECRET…"
          openssl rand -base64 32 | pnpm exec wrangler secret put BETTER_AUTH_SECRET
          echo "✓ Set. Random, never printed."

      # Everything above can succeed and still leave an app that 500s on every
      # request — that is exactly what happened to Tessa, whose secret step ran
      # BEFORE there was a worker to read secrets from, took the correct
      # "leave it alone" branch, and reported success. This is the step that
      # would have caught it. Same script as `deploy.yml`, so the two cannot
      # disagree about what "working" means.
      - name: Verify it can actually boot
        run: node scripts/boot-check.mjs "$APP"

      - name: What is left
        if: always()
        env:
          NAME: ${{ steps.app.outputs.name }}
        run: |
          {
            echo "## Provisioned $NAME"
            echo ""
            echo "Resources created or adopted, ids committed to \`${{ steps.app.outputs.dir }}/wrangler.jsonc\`,"
            echo "worker deployed, email seeded. Every later push to main redeploys it."
            echo ""
            echo "Two things are left, and neither can be done from here:"
            echo ""
            echo "1. **Verify the sender.** \`noreply@4dl.app\` has to be onboarded under"
            echo "   Cloudflare → Email → Email Sending before anything delivers. Verification"
            echo "   lives on the zone, not in this repo. Done once for the whole platform —"
            echo "   every app shares this address, so a second app needs nothing here."
            echo "2. **Routes.** Add \`<root>/*\` and \`*.<root>/*\` in the Cloudflare dashboard."
            echo "   They are deliberately absent from wrangler.jsonc: declaring them makes"
            echo "   \`wrangler dev\` rewrite the Host and collapse all five doors onto the root."
          } >> "$GITHUB_STEP_SUMMARY"
