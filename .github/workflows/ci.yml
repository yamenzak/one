name: CI

# Pre-merge validation. `deploy.yml` only runs on push to main, which means
# nothing used to be checked BEFORE a merge — a PR could go green on nothing and
# break main on the way in. This runs the same install → build → typecheck →
# test chain as the deploy gate, but touches no Cloudflare credentials and
# deploys nothing.
#
# Adding an app is a `apps.json` ENTRY, not an edit here. Both jobs derive their
# work from the registry, because the last two CI failures on main were a per-app
# step somebody forgot to duplicate: Tessa's SPA build was missing, so its whole
# Miniflare suite reported "no tests" — a PASS-shaped result.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseding a PR's own older run is fine here — nothing is deployed, so a
  # cancelled run leaves no partial state.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.registry.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      # Both guards go BEFORE install: a check that needs the workspace
      # installed cannot guard the workspace's own install, and both of these
      # catch failures that are SILENT rather than loud.
      #
      # A workflow with broken YAML does not FAIL — it does not RUN. GitHub
      # lists it by filename, its Run-workflow button never appears, and nothing
      # says why. That is how provision-tessa.yml shipped dead.
      - run: node .github/workflows/workflows-parse.test.mjs
      # An app that is not in the registry is not built and not deployed, and
      # nothing reports it — see the header.
      - run: node scripts/apps-manifest.test.mjs

      # No version — read from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # EVERY SPA, from the registry. Each worker serves its app through an
      # `assets` binding, and the Miniflare integration suites report "no tests"
      # — a PASS-shaped result — when the directory is missing. Turbo cannot
      # infer this: an `assets.directory` is a filesystem path, not a package
      # dependency, so nothing in the graph connects a worker's tests to its
      # app's build. Deriving the list from `apps.json` is what stops it being
      # explicit-and-stale, which is exactly how Tessa's went missing.
      - name: Build every SPA
        run: |
          set -euo pipefail
          for pkg in $(node scripts/apps.mjs spas); do
            echo "::group::build $pkg"
            pnpm --filter "$pkg" build
            echo "::endgroup::"
          done

      - run: pnpm turbo run typecheck test

      - id: registry
        run: echo "e2e=$(node scripts/apps.mjs e2e-matrix)" >> "$GITHUB_OUTPUT"

  # One job per registered Playwright suite — Kova's three golden paths
  # (SPEC §12), Tessa's recall and scan paths — in a real browser against the
  # real worker.
  #
  # Separate jobs on purpose, rather than one appended run: each boots its own
  # worker on its own port (8787 / 8788), and a shared job would make "which
  # product is broken" a question you answer by reading a log. They also need a
  # Chromium download the unit lanes don't.
  #
  # Credential-free and network-free, like `validate`: Playwright boots
  # `wrangler dev --local` (D1/KV/R2 simulated by Miniflare), each suite creates
  # its own tenants and users through the app's own sign-in, and nothing calls
  # Workers AI, Stripe, or an external provider.
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      # One product's flake must not hide the other's real failure.
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.e2e) }}
    name: e2e ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium only — every suite runs one project, and --with-deps pulls the
      # system libraries headless Chromium needs on a bare ubuntu runner.
      - run: pnpm --filter ${{ matrix.e2e }} exec playwright install --with-deps chromium

      # The worker under test serves the built SPA through its `assets` binding,
      # so the directory has to exist before Playwright's webServer boots it.
      - name: Build its SPA
        if: matrix.spa != ''
        run: pnpm --filter ${{ matrix.spa }} build

      - run: pnpm --filter ${{ matrix.e2e }} e2e

      # Traces + screenshots for the paths that failed. Nothing is attached on a
      # green run, so this stays cheap.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.id }}
          path: |
            ${{ matrix.dir }}/playwright-report/
            ${{ matrix.dir }}/test-results/
          retention-days: 7
