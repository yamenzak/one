name: CI

# Pre-merge validation. Deploy.yml only runs on push to main, which means
# nothing used to be checked BEFORE a merge — a PR could go green on nothing and
# break main on the way in. This runs the same install → build → typecheck →
# test chain as the deploy job, but touches no Cloudflare credentials and
# deploys nothing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseding a PR's own older run is fine here — nothing is deployed, so a
  # cancelled run leaves no partial state.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version — read from package.json's packageManager (pnpm@10.33.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A workflow with broken YAML does not FAIL — it does not RUN. GitHub
      # lists it by filename, its Run-workflow button never appears, and nothing
      # says why. That is how provision-tessa.yml shipped dead. Needs no deps,
      # so it goes before install.
      - run: node .github/workflows/workflows-parse.test.mjs

      - run: pnpm install --frozen-lockfile

      # Build BOTH SPAs. Each worker serves its app through an `assets`
      # binding, and the Miniflare integration suites report "no tests" — a
      # PASS-shaped result — when the directory is missing. Kova's has been here
      # since it was written; Tessa's absence is what turned the merge that
      # added `apps/tessa-app` red, because turbo cannot infer the dependency: an
      # `assets.directory` is a filesystem path, not a package dependency, so
      # nothing in the graph connects @4dl/tessa's tests to @tessa/app's build.
      - run: pnpm --filter @kova/app build
      - run: pnpm --filter @tessa/app build

      - run: pnpm turbo run typecheck test

  # The three golden paths (SPEC §12), in a real browser against the real worker.
  #
  # A separate job on purpose: it needs a Chromium download the unit lanes don't,
  # and keeping it apart means "E2E is red" and "unit tests are red" are distinct
  # signals rather than one long log to bisect.
  #
  # Credential-free and network-free, like `validate`: Playwright boots
  # `wrangler dev --local` (D1/KV/R2 simulated by Miniflare), the suite creates its
  # own tenants and users through the app's own sign-in, and nothing calls Workers
  # AI, Stripe, or an external food/exercise provider.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only — the suite runs one project, and --with-deps pulls the
      # system libraries headless Chromium needs on a bare ubuntu runner.
      - run: pnpm --filter @kova/e2e exec playwright install --with-deps chromium

      # Boots the worker itself (webServer) after turbo builds the SPA it serves.
      - run: pnpm e2e

      # Traces + screenshots for the paths that failed. Nothing is attached on a
      # green run, so this stays cheap.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # Tessa's golden paths — the recall in both directions, and the scan-first
  # path. Separate from Kova's job rather than appended to it: they boot
  # different workers on different ports (8788 vs 8787) and a shared job would
  # make "which product is broken" a question you answer by reading a log.
  tessa-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tessa/e2e exec playwright install --with-deps chromium
      # The worker serves the built SPA, so it has to exist before the suite
      # boots it — same reason as the validate job above.
      - run: pnpm --filter @tessa/app build
      - run: pnpm --filter @tessa/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tessa-e2e-report
          path: |
            apps/tessa-e2e/playwright-report/
            apps/tessa-e2e/test-results/
          retention-days: 7
