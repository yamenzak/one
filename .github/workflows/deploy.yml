name: Deploy

# Every push to main typechecks, tests, builds every SPA, and deploys every app
# that `apps.json` says is deployable. Adding an app is a REGISTRY ENTRY, not an
# edit here — every deployment problem this repo has had was a per-app step
# somebody forgot to duplicate.
#
# Requires exactly TWO repo secrets:
#   CLOUDFLARE_API_TOKEN   — Workers/D1/KV/R2 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  — the account id
#
# BETTER_AUTH_SECRET is deliberately NOT a repo secret and is never written
# here. It is a WORKER secret, set once by the provisioning workflow: re-putting
# it on every deploy would rewrite Better Auth's cookie-signing key and sign
# every user out.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # NOT cancel-in-progress. Several workers deploy from one run; cancelling
  # mid-flight can land between them, leaving one app on commit N and another on
  # N-1 with no signal. Queueing costs CI time and converges on the newest commit.
  cancel-in-progress: false

jobs:
  # ── The gate. Nothing deploys unless this passes. ────────────────────────
  #
  # It also computes the deploy matrix, so the tests and the deploys can never
  # disagree about which apps exist.
  gate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Before install: a check that needs the workspace installed cannot guard
      # the workspace. Both are dependency-free Node, and both guard failures
      # that are SILENT rather than loud — a broken workflow does not fail, it
      # does not run; an unregistered app is not built, so its Miniflare suite
      # reports "no tests", which reads as a pass. Both have happened here.
      - run: node .github/workflows/workflows-parse.test.mjs
      - run: node scripts/apps-manifest.test.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # EVERY SPA, from the registry. Each worker serves its app through an
      # `assets` binding. Turbo cannot infer this — an `assets.directory` is a
      # filesystem path, not a package dependency — so it must be explicit, and
      # deriving it from the registry is what stops it being explicit-and-stale.
      - name: Build every SPA
        run: |
          set -euo pipefail
          for pkg in $(node scripts/apps.mjs spas); do
            echo "::group::build $pkg"
            pnpm --filter "$pkg" build
            echo "::endgroup::"
          done

      - run: pnpm turbo run typecheck test

      - id: registry
        run: echo "matrix=$(node scripts/apps.mjs matrix)" >> "$GITHUB_OUTPUT"

  # ── One job per deployable app. ──────────────────────────────────────────
  #
  # `fail-fast: false` so one app's failure does not strand the others.
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate.outputs.matrix) }}
    name: deploy ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # An app still binding PLACEHOLDER ids is SKIPPED, not failed. Deploying
      # against them does not error — wrangler binds or creates *something* —
      # and the worker comes up pointing at nothing. Provisioning replaces the
      # ids and turns this on by itself.
      - id: ready
        run: |
          set -uo pipefail
          if node scripts/apps.mjs ready "${{ matrix.id }}"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.id }} is not provisioned — skipping its deploy. Run 'Provision an app on Cloudflare'."
          fi

      - name: Build its SPA
        if: steps.ready.outputs.go == 'true'
        run: |
          set -euo pipefail
          spa=$(node --input-type=module -e "import {app} from './scripts/apps.mjs'; process.stdout.write(app('${{ matrix.id }}').spa ?? '')")
          if [ -n "$spa" ]; then pnpm --filter "$spa" build; fi

      # No secrets are set here — see the header.
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.dir }}
          command: deploy
          preCommands: ${{ matrix.pre }}

      # ── Did it come up? ───────────────────────────────────────────────────
      #
      # `ready` above asks "are the resource ids real?", which is a question
      # about the CONFIG. It is blind to a worker that deploys perfectly and then
      # throws on every request — which is not hypothetical: Tessa shipped green
      # from this workflow for a day while every route 500'd. The script explains
      # the failure in full; it is shared with the provisioning workflow so the
      # two cannot drift.
      - name: Verify it can actually boot
        if: steps.ready.outputs.go == 'true'
        run: node scripts/boot-check.mjs "${{ matrix.id }}"
