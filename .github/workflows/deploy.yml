name: Deploy

# Every push to main (and manual runs) typechecks, tests, builds the app, and
# deploys the api worker + www to Cloudflare.
#
# Requires exactly TWO repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers/D1/KV/R2 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#
# BETTER_AUTH_SECRET is deliberately NOT a repo secret and is never written by
# this workflow — see the note on the deploy step below. It is a *worker* secret
# set once by hand (`wrangler secret put`, DEPLOY.md §5b). Adding it as a third
# GitHub secret has no effect, and skipping the manual step makes every
# authenticated request throw in production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # NOT cancel-in-progress. This job deploys TWO workers in sequence (api, then
  # www). Cancelling mid-run can land between them, leaving the api worker on
  # commit N and www on commit N-1 with no signal that it happened. Queueing
  # instead costs a little CI time and always converges on the newest commit.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here — action-setup reads it from package.json's
      # packageManager field (pnpm@10.33.0). Specifying both errors out.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the SPA first — the api worker serves apps/app/dist, and the
      # integration tests need it present for the assets binding.
      - run: pnpm --filter @mossa/app build

      - run: pnpm turbo run typecheck test

      # NOTE: we deliberately do NOT set secrets here. Worker secrets persist
      # across `wrangler deploy`, so re-putting BETTER_AUTH_SECRET every deploy
      # would rewrite Better Auth's cookie-signing key and invalidate all
      # sessions (forced re-auth). It's set once with `wrangler secret put`
      # (see DEPLOY.md §5b). Deploys only ship code — sessions + passkeys survive.
      - name: Deploy api worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Build + deploy www
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/www
          command: deploy
          preCommands: node build.mjs
